<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S. — Red Orb</title>
<style>
:root{--bg:#050001;--red:#ff2a3d;--dim:#7a0f1c;--tx:#ffd9dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Courier New",ui-monospace,monospace;overflow:hidden}
#roses{position:fixed;inset:0;width:100%;height:100%}
#orbw{--w:min(94vw,520px);position:fixed;width:var(--w);height:var(--w);left:calc(50% - var(--w)/2);top:44px;z-index:5;filter:drop-shadow(0 0 30px #ff1030cc)}
#orb{width:100%;height:100%;touch-action:none;cursor:grab}
#mv{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#000;border:1px solid var(--red);color:var(--red);font-size:11px;padding:3px 10px;border-radius:12px;cursor:move;touch-action:none;letter-spacing:2px}
#hint{position:fixed;left:12px;top:52px;font-size:12px;letter-spacing:2px;color:#ff6b7a;z-index:4;pointer-events:none}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:55%;background:#0a0204ee;border-top:1px solid var(--red);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:none;overflow:auto;box-shadow:0 -10px 40px #ff102040}
#panel h2{margin:0 0 8px;font-size:14px;letter-spacing:4px;color:var(--red)}
#x{position:absolute;right:12px;top:8px;background:none;border:1px solid var(--dim);color:var(--red);cursor:pointer;padding:2px 8px}
input,textarea,button.b{background:#140308;border:1px solid var(--dim);color:var(--tx);font:inherit;padding:8px;border-radius:4px;width:100%}
button.b{width:auto;cursor:pointer;border-color:var(--red);color:var(--red)}
button.b:hover{background:var(--red);color:#000}
.row{display:flex;gap:6px;margin-bottom:8px}
#log,pre{white-space:pre-wrap;word-break:break-word;background:#000a;border:1px solid #3a0a12;padding:8px;border-radius:4px;max-height:28vh;overflow:auto;font-size:13px;margin:0}
#big{font-size:44px;text-align:center;color:var(--red);text-shadow:0 0 14px var(--red)}
#top{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:7;display:flex;gap:6px}
#wake{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
#wake h1{color:var(--red);letter-spacing:8px;text-shadow:0 0 20px var(--red);font-size:26px;margin:0}
</style></head><body>
<canvas id="roses"></canvas>
<div id="orbw"><canvas id="orb" width="800" height="800"></canvas><div id="mv">✥ MOVE</div></div>
<div id="hint">DRAG THE ORB TO ROTATE IN 3D • FLICK THE RING TO CHOOSE AN APP</div>
<div id="top"><button class="b" id="spin">SPIN</button><button class="b" id="mute">VOICE: ON</button></div>
<div id="panel"><button id="x">✕</button><h2 id="ptitle"></h2><div id="pbody"></div></div>
<div id="wake"><h1>J.A.R.V.I.S.</h1><div style="color:#ff6b7a">At your service, sir.</div><button class="b" id="go">INITIALISE, SIR</button></div>
<script>
const $=id=>document.getElementById(id);
const APPS=["SOLVE","CODE","CLOCK","CALC","NOTES"],N=APPS.length,STEP=2*Math.PI/N;
let muted=false;
// ---------- voice (British) ----------
const TTS_URL="https://withered-moon-03cf.jarvismetalman.workers.dev/ttslet cur=null, spk=0"; // <- paste your worker address here, ending in /ttslet cur=null,spk=0;
function browserSpeak(t){
  if(!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),v=speechSynthesis.getVoices();
    u.voice=v.find(x=>/en-GB/i.test(x.lang)&&/male|daniel|arthur|oliver/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||null;
    u.lang="en-GB";u.rate=.95;u.pitch=.8;speechSynthesis.speak(u)}catch(e){}
}
async function speak(t){
  const id=++spk;if(cur){cur.pause();cur=null}if(window.speechSynthesis)speechSynthesis.cancel();
  if(muted)return;
  t=t.replace(/```[\s\S]*?```/g," ").trim();if(!t)return;   // only fenced code is skipped; the words are spoken exactly as written
  if(TTS_URL&&!/YOUR-WORKER/.test(TTS_URL)){
    try{
      const r=await fetch(TTS_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})});
      if(!r.ok)throw 0;const url=URL.createObjectURL(await r.blob());
      if(id!==spk||muted)return;cur=new Audio(url);await cur.play();return;
    }catch(e){}
  }
  if(id===spk)browserSpeak(t);
}
$("mute").onclick=()=>{muted=!muted;$("mute").textContent="VOICE: "+(muted?"OFF":"ON");if(muted){cur&&cur.pause();window.speechSynthesis&&speechSynthesis.cancel()}};
$("go").onclick=()=>{$("wake").style.display="none";speak("Good evening, sir. All systems are online. What problem shall we solve, sir?");openApp("SOLVE")};
// ---------- dripping red liquid background ----------
const rc=$("roses"),rx=rc.getContext("2d");let drips=[];
function nd(x,len){return{x,w:3+Math.random()*8,len,sp:.3+Math.random()*1.2,max:100+Math.random()*rc.height*.9,wait:0}}
function initD(){rc.width=innerWidth;rc.height=innerHeight;drips=[];for(let x=-4;x<rc.width;x+=20)drips.push(nd(x+Math.random()*14,Math.random()*rc.height*.5))}
addEventListener("resize",initD);initD();
function bg(){
  const W=rc.width,H=rc.height,now=performance.now();rx.fillStyle="#080002";rx.fillRect(0,0,W,H);
  for(const d of drips){
    if(d.len<d.max)d.len+=d.sp;else if(++d.wait>500)Object.assign(d,nd(d.x,0));
    const g=rx.createLinearGradient(0,0,0,d.len+1);g.addColorStop(0,"#4a0009");g.addColorStop(.6,"#b8001a");g.addColorStop(1,"#ff2a3d");
    rx.fillStyle=g;rx.fillRect(d.x,0,d.w,d.len);
    rx.beginPath();rx.arc(d.x+d.w/2,d.len,d.w*.85,0,7);rx.fill();
    rx.fillStyle="rgba(255,200,200,.28)";rx.fillRect(d.x+d.w*.2,0,d.w*.15,d.len);
    rx.beginPath();rx.arc(d.x+d.w*.35,d.len-d.w*.2,d.w*.2,0,7);rx.fill();
  }
  const pg=rx.createLinearGradient(0,0,0,60);pg.addColorStop(0,"#5a000c");pg.addColorStop(1,"#c2001c");rx.fillStyle=pg;rx.beginPath();rx.moveTo(0,0);rx.lineTo(W,0);
  for(let x=W;x>=0;x-=16)rx.lineTo(x,32+Math.sin(x*.04+now/900)*9+Math.sin(x*.11+now/500)*4);rx.fill();
  const v=rx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.7)");rx.fillStyle=v;rx.fillRect(0,0,W,H);
}
// ---------- 3D orb ----------
const oc=$("orb"),ox=oc.getContext("2d"),ow=$("orbw");
const P=[];for(let i=0;i<700;i++){const y=1-2*(i+.5)/700,r=Math.sqrt(1-y*y),a=i*2.39996;P.push([Math.cos(a)*r,y,Math.sin(a)*r,Math.random()])}
const W3=[];
for(let j=-2;j<=2;j++){const y=j*.34,r=Math.sqrt(1-y*y),l=[];for(let i=0;i<=48;i++){const a=i/48*6.2832;l.push([Math.cos(a)*r,y,Math.sin(a)*r])}W3.push(l)}
for(let j=0;j<6;j++){const b=j*Math.PI/6,l=[];for(let i=0;i<=48;i++){const a=i/48*6.2832,x=Math.cos(a),y=Math.sin(a);l.push([x*Math.cos(b),y,x*Math.sin(b)])}W3.push(l)}
let M=[1,0,0,0,1,0,0,0,1],wx=0,wy=.004;
const mul=(a,b)=>{const r=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)r[i*3+j]=a[i*3]*b[j]+a[i*3+1]*b[3+j]+a[i*3+2]*b[6+j];return r};
const rY=a=>{const c=Math.cos(a),s=Math.sin(a);return[c,0,s,0,1,0,-s,0,c]},rX=a=>{const c=Math.cos(a),s=Math.sin(a);return[1,0,0,0,c,-s,0,s,c]};
const spin3=(dx,dy)=>{M=mul(mul(rX(dy),rY(dx)),M)};
const tr=p=>[M[0]*p[0]+M[1]*p[1]+M[2]*p[2],M[3]*p[0]+M[4]*p[1]+M[5]*p[2],M[6]*p[0]+M[7]*p[1]+M[8]*p[2]];
let rot=-Math.PI/2,vel=0,mode=null,snapTo=null,lastA=0,lx=0,ly=0,sel=0;
function draw(){
  ox.setTransform(800/600,0,0,800/600,0,0);ox.clearRect(0,0,600,600);ox.translate(300,300);
  ox.strokeStyle="#ff2a3d";ox.lineWidth=2;ox.setLineDash([2,10]);ox.beginPath();ox.arc(0,0,262,0,7);ox.stroke();ox.setLineDash([]);
  ox.strokeStyle="#9a1024";ox.beginPath();ox.arc(0,0,218,0,7);ox.stroke();
  ox.font="bold 26px Courier New";ox.textAlign="center";ox.textBaseline="middle";
  for(let i=0;i<N;i++){
    const a=rot+i*STEP,x=Math.cos(a)*240,y=Math.sin(a)*240,top=Math.cos(a+Math.PI/2)>.97;
    ox.save();ox.translate(x,y);ox.rotate(a+Math.PI/2);ox.fillStyle=top?"#fff":"#ff2a3d";ox.shadowColor="#ff2a3d";ox.shadowBlur=top?24:8;ox.fillText(APPS[i],0,0);ox.restore();
  }
  ox.fillStyle="#fff";ox.beginPath();ox.moveTo(0,-284);ox.lineTo(-9,-298);ox.lineTo(9,-298);ox.fill();
  const R=185,pr=z=>1/(1-.12*z);
  let bgd=ox.createRadialGradient(-40,-50,10,0,0,R*1.05);bgd.addColorStop(0,"#3a0510");bgd.addColorStop(1,"#000");
  ox.fillStyle=bgd;ox.beginPath();ox.arc(0,0,R*1.02,0,7);ox.fill();
  ox.globalCompositeOperation="lighter";ox.lineWidth=1.4;
  for(const l of W3){let q=tr(l[0]);for(let i=1;i<l.length;i++){const n=tr(l[i]),z=(q[2]+n[2])/2;
    ox.strokeStyle=`rgba(255,40,60,${.08+(z+1)*.3})`;ox.beginPath();ox.moveTo(q[0]*R*pr(q[2]),q[1]*R*pr(q[2]));ox.lineTo(n[0]*R*pr(n[2]),n[1]*R*pr(n[2]));ox.stroke();q=n}}
  for(const p of P){const q=tr(p),k=pr(q[2]),f=(q[2]+1)/2;
    ox.fillStyle=`rgba(255,${30+f*70|0},${50+f*50|0},${.2+f*.8})`;ox.beginPath();ox.arc(q[0]*R*k,q[1]*R*k,1+p[3]*2.2*f,0,7);ox.fill()}
  const g=ox.createRadialGradient(0,0,0,0,0,80);g.addColorStop(0,"rgba(255,210,210,.85)");g.addColorStop(.3,"rgba(255,40,60,.45)");g.addColorStop(1,"rgba(255,0,20,0)");
  ox.fillStyle=g;ox.beginPath();ox.arc(0,0,80,0,7);ox.fill();ox.globalCompositeOperation="source-over";
}
function tick(){
  bg();
  if(mode!=="rot"){spin3(wy,wx);wx*=.97;wy=.004+(wy-.004)*.97}
  if(mode!=="spin"){
    if(snapTo!==null){rot+=(snapTo-rot)*.12;if(Math.abs(snapTo-rot)<.002){rot=snapTo;snapTo=null;openApp(APPS[sel])}}
    else if(Math.abs(vel)>.004){rot+=vel;vel*=.985;if(Math.abs(vel)<=.004){vel=0;const k=Math.round((-Math.PI/2-rot)/STEP);snapTo=-Math.PI/2-k*STEP;sel=((k%N)+N)%N}}
  }
  draw();requestAnimationFrame(tick);
}
const GREET={SOLVE:"Tell me your problem, sir.",CODE:"Shall we write some code, sir?",CLOCK:"The time, sir.",CALC:"Numbers at your command, sir.",NOTES:"Your notes, sir."};
oc.addEventListener("pointerdown",e=>{
  const r=oc.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(e.clientX-cx,e.clientY-cy)/(r.width/600);
  oc.setPointerCapture(e.pointerId);snapTo=null;$("hint").style.display="none";
  if(d<215){mode="rot";lx=e.clientX;ly=e.clientY;wx=wy=0}
  else{mode="spin";lastA=Math.atan2(e.clientY-cy,e.clientX-cx);vel=0}
});
oc.addEventListener("pointermove",e=>{
  if(mode==="rot"){const dx=(e.clientX-lx)*.012,dy=(e.clientY-ly)*.012;spin3(dx,dy);wy=dx;wx=dy;lx=e.clientX;ly=e.clientY}
  else if(mode==="spin"){const r=oc.getBoundingClientRect(),a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));let d=a-lastA;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;rot+=d;vel=d;lastA=a}
});
oc.addEventListener("pointerup",()=>{const m=mode;mode=null;if(m==="spin"&&Math.abs(vel)<.004)vel=.0041});
const mv=$("mv");let mo=null;
mv.addEventListener("pointerdown",e=>{mv.setPointerCapture(e.pointerId);const r=ow.getBoundingClientRect();mo=[e.clientX-r.left,e.clientY-r.top]});
mv.addEventListener("pointermove",e=>{if(mo){ow.style.left=(e.clientX-mo[0])+"px";ow.style.top=(e.clientY-mo[1])+"px"}});
mv.addEventListener("pointerup",()=>mo=null);
$("spin").onclick=()=>{snapTo=null;vel=(.25+Math.random()*.3)*(Math.random()<.5?-1:1);closeP()};
tick();
// ---------- apps ----------
const panel=$("panel"),pb=$("pbody");
function closeP(){panel.style.display="none";clearInterval(clk)}
$("x").onclick=closeP;
let clk;
function el(h){const d=document.createElement("div");d.innerHTML=h;return d}
function openApp(n){
  clearInterval(clk);panel.style.display="block";$("ptitle").textContent=n;pb.innerHTML="";speak(GREET[n]);
  if(n==="SOLVE")chatUI(false);else if(n==="CODE")chatUI(true);
  else if(n==="CLOCK"){pb.innerHTML='<div id="big"></div><div id="dt" style="text-align:center;color:#ff6b7a"></div>';const u=()=>{const d=new Date();$("big").textContent=d.toLocaleTimeString();$("dt").textContent=d.toDateString()};u();clk=setInterval(u,1000)}
  else if(n==="CALC"){pb.innerHTML='<div class="row"><input id="ce" placeholder="e.g. (12+8)*3.5, sir" inputmode="text"><button class="b" id="cb">=</button></div><div id="big"></div>';
    const go=()=>{const v=$("ce").value;if(!/^[\d+\-*/().%\s^]+$/.test(v)){$("big").textContent="?";return}try{const r=Function('"use strict";return ('+v.replace(/\^/g,"**")+')')();$("big").textContent=r;speak("That comes to "+r+", sir.")}catch(e){$("big").textContent="ERR"}};
    $("cb").onclick=go;$("ce").onkeydown=e=>e.key==="Enter"&&go()}
  else if(n==="NOTES"){pb.innerHTML='<textarea id="nt" rows="6" placeholder="Jot something down, sir..."></textarea>';let v="";try{v=localStorage.getItem("jv-notes")||""}catch(e){}$("nt").value=v;$("nt").oninput=()=>{try{localStorage.setItem("jv-notes",$("nt").value)}catch(e){}}}
}
const SYS="You are J.A.R.V.I.S., a refined, witty British butler AI with encyclopedic knowledge. Address the user as 'sir' often (at least two or three times per reply). Use British spelling. You are an expert problem solver: work through maths, coding, homework, work and life problems step by step, clearly and concisely, then give the answer.";
const CSYS=SYS+" The user wants working code. Reply with ONE complete, well-commented code block in a fenced block, then one short sentence to 'sir' explaining how to run it.";
function chatUI(code){
  pb.innerHTML=`<div class="row"><input id="q" placeholder="${code?"What shall I build, sir? e.g. a snake game in HTML":"Tell me your problem, sir..."}"><button class="b" id="s">SEND</button></div><${code?"pre":"div"} id="log"></${code?"pre":"div"}>${code?'<div class="row" style="margin-top:8px"><button class="b" id="cp">COPY CODE</button></div>':""}`;
  const send=async()=>{
    const q=$("q").value.trim();if(!q)return;$("q").value="";const log=$("log");log.textContent="Consulting the archives, sir...";
    try{
      const s=window.claude&&await claude.use("sample");
      if(!s)throw 0;
      const r=await s([{role:"user",content:(code?CSYS:SYS)+"\n\nRequest: "+q}],{cache:false,onText:o=>{log.textContent=o.text}});
      log.textContent=r.text;speak(r.text);
    }catch(e){log.textContent="I'm afraid my link to the mainframe is unavailable, sir. Open me from your Claude account and do try again.";speak("I'm afraid my link to the mainframe is unavailable, sir.")}
  };
  $("s").onclick=send;$("q").onkeydown=e=>e.key==="Enter"&&send();
  if(code)$("cp").onclick=()=>{const m=$("log").textContent.match(/```\w*\n([\s\S]*?)```/);navigator.clipboard&&navigator.clipboard.writeText(m?m[1]:$("log").textContent).then(()=>speak("Copied, sir."),()=>{})};
}
</script></body></html>
